<!doctype html>
<html lang="th" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartGift — Knowledge Graph (local)</title>
<style>
  :root{
    --paper:#f2f2f0; --ink:#1a1a19; --hair:color-mix(in oklch, var(--ink) 14%, transparent);
    --hair-strong:color-mix(in oklch, var(--ink) 30%, transparent);
    --surface:#e6e6e3; --surface-2:#dcdcd9;
    --accent-candidate:#c0392b;
    --mono: 'Cascadia Mono','Consolas','SFMono-Regular',ui-monospace,monospace;
    --sans: 'Leelawadee UI','Segoe UI',Tahoma,'Noto Sans Thai',sans-serif;
    --c-Customer:#2e8b3d; --c-Document:#7d848b; --c-Product:#2f7fd6; --c-CatalogSource:#8551c9;
    --c-Brand:#b8860b; --c-Competitor:#c94f8f; --c-Org:#d67a2c; --c-KnowledgeChunk:#1f9aa3;
    --c-candidate:#c0392b;
  }
  [data-theme="dark"]{
    --paper:#17181a; --ink:#eceae5;
    --surface:#202124; --surface-2:#28292c;
    --c-Customer:#3fb950; --c-Document:#8b949e; --c-Product:#58a6ff; --c-CatalogSource:#a371f7;
    --c-Brand:#d29922; --c-Competitor:#f778ba; --c-Org:#ff9e64; --c-KnowledgeChunk:#56d4dd;
    --c-candidate:#e5534b;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit;color:inherit}
  ::selection{background:var(--ink);color:var(--paper)}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:.9rem; flex:none;
    padding:.65rem 1rem; border-bottom:1px solid var(--hair); background:var(--paper); z-index:20;
  }
  .brand{font-weight:700; letter-spacing:-0.01em; font-size:.95rem; white-space:nowrap}
  .brand small{display:block; font-family:var(--mono); font-weight:400; font-size:.62rem;
    letter-spacing:.14em; text-transform:uppercase; color:color-mix(in oklch, var(--ink) 55%, transparent)}
  .pdpa{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.05em; font-weight:700;
    color:var(--accent-candidate); border:1px solid color-mix(in oklch, var(--accent-candidate) 55%, transparent);
    background:color-mix(in oklch, var(--accent-candidate) 10%, transparent);
    border-radius:999px; padding:.3em .75em; white-space:nowrap;
  }
  .searchWrap{position:relative; flex:1; max-width:26rem}
  .search{
    width:100%; background:var(--surface); border:1px solid var(--hair); border-radius:999px;
    padding:.5em 1em; font-size:.85rem; outline:none; transition:border-color .15s;
  }
  .search:focus{border-color:var(--hair-strong)}
  .searchResults{
    position:absolute; top:calc(100% + 6px); left:0; right:0; max-height:60vh; overflow:auto;
    background:var(--paper); border:1px solid var(--hair-strong); border-radius:.75rem;
    box-shadow:0 20px 44px -20px rgba(0,0,0,.35); display:none; z-index:30;
  }
  .searchResults.open{display:block}
  .searchRow{display:flex; align-items:center; gap:.6rem; padding:.55rem .85rem; cursor:pointer; font-size:.82rem}
  .searchRow:hover{background:var(--surface)}
  .dot{width:.55rem;height:.55rem;border-radius:50%;flex:none}
  .searchRow .rowLabel{font-family:var(--mono); font-size:.58rem; letter-spacing:.08em; text-transform:uppercase;
    color:color-mix(in oklch, var(--ink) 55%, transparent)}
  .topbtns{display:flex; gap:.4rem; margin-left:auto; flex:none}
  .btn{
    border:1px solid var(--hair-strong); border-radius:999px; padding:.4em .9em; font-size:.76rem;
    font-weight:600; transition:background .15s,border-color .15s; white-space:nowrap;
  }
  .btn:hover{background:var(--surface)}
  .stat{font-family:var(--mono); font-size:.68rem; color:color-mix(in oklch, var(--ink) 55%, transparent); white-space:nowrap}

  /* ---------- body layout ---------- */
  .body{flex:auto; display:flex; min-height:0; position:relative}
  .sidebar{
    width:17.5rem; flex:none; border-right:1px solid var(--hair); background:var(--paper);
    display:flex; flex-direction:column; min-height:0; z-index:10;
    transition:transform .3s cubic-bezier(.19,1,.22,1);
  }
  .sidebar[data-collapsed="true"]{transform:translateX(-100%); position:absolute; height:100%}
  .sideSection{padding:.9rem 1rem .3rem}
  .sideTitle{font-family:var(--mono); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
    color:color-mix(in oklch, var(--ink) 50%, transparent); font-weight:700; margin-bottom:.5rem}
  .legend{display:flex; flex-direction:column; gap:.15rem; padding:0 .5rem .6rem}
  .legendRow{display:flex; align-items:center; gap:.55rem; padding:.32rem .5rem; border-radius:.5rem; font-size:.78rem}
  .legendRow:hover{background:var(--surface)}
  .legendRow input{accent-color:var(--ink)}
  .legendName{flex:auto}
  .legendCount{font-family:var(--mono); font-size:.66rem; color:color-mix(in oklch, var(--ink) 50%, transparent)}
  .candidateNote{font-size:.68rem; line-height:1.5; padding:.4rem .5rem 0; color:color-mix(in oklch, var(--ink) 60%, transparent)}
  .browseList{flex:auto; overflow:auto; border-top:1px solid var(--hair); margin-top:.4rem}
  .browseGroup .browseGroupHead{
    position:sticky; top:0; background:var(--paper); font-family:var(--mono); font-size:.6rem;
    letter-spacing:.14em; text-transform:uppercase; padding:.5rem 1rem .25rem; color:color-mix(in oklch, var(--ink) 50%, transparent);
  }
  .browseRow{display:flex; align-items:center; gap:.55rem; padding:.4rem 1rem; cursor:pointer; font-size:.82rem}
  .browseRow:hover{background:var(--surface)}
  .browseRow[data-active="true"]{background:var(--surface-2); font-weight:700}
  .browseRow .name{flex:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  .stageWrap{flex:auto; position:relative; min-width:0; overflow:hidden}
  canvas{display:block; width:100%; height:100%; cursor:grab}
  canvas.dragging{cursor:grabbing}
  .hint{
    position:absolute; left:1rem; bottom:1rem; font-family:var(--mono); font-size:.66rem; line-height:1.7;
    color:color-mix(in oklch, var(--ink) 55%, transparent); pointer-events:none; max-width:20rem;
  }
  .sidebarToggle{
    position:absolute; top:.7rem; left:.7rem; z-index:11; width:2rem; height:2rem; border-radius:50%;
    border:1px solid var(--hair-strong); background:var(--paper); display:grid; place-items:center;
  }

  /* ---------- node detail panel (styled after the reference template) ---------- */
  .panel{
    --pad-x:1.9rem; position:absolute; top:0; right:0; height:100%; width:min(23rem,88vw);
    background:var(--paper); border-left:1px solid var(--hair-strong); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .45s cubic-bezier(.16,1,.3,1); z-index:15;
    box-shadow:-24px 0 44px -30px rgba(0,0,0,.4);
  }
  .panel[data-open="true"]{transform:translateX(0)}
  .panelInner{flex:auto; min-height:0; overflow:auto; padding:1.6rem var(--pad-x) 1rem}
  .panelClose{
    position:absolute; top:1.1rem; right:1.1rem; width:2.1rem; height:2.1rem; border-radius:50%;
    border:1px solid var(--hair-strong); display:grid; place-items:center;
  }
  .panelMeta{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; padding-right:2.2rem}
  .panelSection{font-family:var(--mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700}
  .panelIndex{font-family:var(--mono); font-size:.68rem; color:color-mix(in oklch, var(--ink) 50%, transparent)}
  .panelTitle{font-size:1.7rem; font-weight:700; letter-spacing:-.02em; line-height:1.08; margin:.9rem 0 0; word-break:break-word}
  .panelId{font-family:var(--mono); font-size:.66rem; color:color-mix(in oklch, var(--ink) 50%, transparent); margin-top:.3rem}
  .statusBadge{display:inline-flex; align-items:center; gap:.35em; font-family:var(--mono); font-size:.6rem;
    letter-spacing:.1em; text-transform:uppercase; font-weight:700; border-radius:999px; padding:.25em .7em; margin-top:.6rem}
  .statusBadge.canonical{color:color-mix(in oklch, var(--ink) 70%, transparent); border:1px solid var(--hair-strong)}
  .statusBadge.candidate{color:var(--c-candidate); border:1px solid color-mix(in oklch, var(--c-candidate) 55%, transparent);
    background:color-mix(in oklch, var(--c-candidate) 10%, transparent)}
  .propTable{width:100%; margin-top:1.1rem; border-collapse:collapse; font-size:.8rem}
  .propTable tr{border-top:1px solid var(--hair)}
  .propTable td{padding:.4rem 0; vertical-align:top}
  .propTable td:first-child{color:color-mix(in oklch, var(--ink) 55%, transparent); width:40%; padding-right:.6rem;
    font-family:var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.04em}
  .propTable td:last-child{word-break:break-word}
  .relBlock{margin-top:1.3rem}
  .relLabel{font-family:var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    color:color-mix(in oklch, var(--ink) 55%, transparent); margin:0 0 .5rem}
  .relList{display:flex; flex-direction:column; gap:.3rem}
  .relPill{
    display:flex; align-items:center; gap:.55rem; text-align:left; border:1px solid var(--hair);
    border-radius:.6rem; padding:.45rem .65rem; font-size:.8rem; transition:border-color .15s, background .15s;
  }
  .relPill:hover{border-color:var(--hair-strong); background:var(--surface)}
  .relPill .name{flex:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .relPill .dir{font-family:var(--mono); font-size:.62rem; color:color-mix(in oklch, var(--ink) 45%, transparent)}
  .pager{display:flex; border-top:1px solid var(--hair); flex:none}
  .pagerBtn{flex:1 1 0; display:flex; align-items:center; gap:.6rem; padding:.85rem var(--pad-x); font-size:.78rem}
  .pagerBtn[data-dir="next"]{justify-content:flex-end; text-align:right; border-left:1px solid var(--hair)}
  .pagerBtn .arrow{width:1.7rem; height:1.7rem; border:1px solid var(--hair-strong); border-radius:50%; display:grid; place-items:center; flex:none}
  .pagerBtn .meta{display:flex; flex-direction:column; gap:.1rem; min-width:0}
  .pagerBtn .kick{font-family:var(--mono); font-size:.56rem; letter-spacing:.14em; text-transform:uppercase;
    color:color-mix(in oklch, var(--ink) 45%, transparent)}
  .pagerBtn .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  @media (max-width:820px){
    .sidebar{position:absolute; height:100%}
    .sidebar[data-collapsed="false"]{box-shadow:24px 0 44px -30px rgba(0,0,0,.4)}
    .panel{width:100vw}
    .searchWrap{max-width:none}
    .brand small{display:none}
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">SmartGift · Knowledge Graph<small>local viewer — generated from data/obsidian-vault</small></div>
    <span class="pdpa">🔒 Local only · PDPA</span>
    <div class="searchWrap">
      <input class="search" id="search" type="text" placeholder="ค้นหาโหนด… (ชื่อลูกค้า, แบรนด์, องค์กร)" autocomplete="off">
      <div class="searchResults" id="searchResults"></div>
    </div>
    <div class="topbtns">
      <button class="btn" id="exportJsonBtn" style="border-color:#2f7fd6;color:#2f7fd6;font-weight:700">💾 Export JSON</button>
      <button class="btn" id="exportHtmlBtn" style="border-color:#2e8b3d;color:#2e8b3d;font-weight:700">📦 Download HTML</button>
      <button class="btn" id="fitBtn">Fit view</button>
      <button class="btn" id="themeBtn">Dark</button>
    </div>
    <span class="stat" id="statLine">0 / 0 nodes · 0 edges shown</span>
  </div>

  <div class="body">
    <button class="sidebarToggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
    <aside class="sidebar" id="sidebar" data-collapsed="false">
      <div class="sideSection">
        <div class="sideTitle">Node types</div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="candidateNote">แดง = <b>candidate</b> (ยังไม่อนุมัติ) — เช่น PriceRow ที่ยังไม่ได้ยืนยันราคา</div>
      <div class="browseList" id="browseList"></div>
    </aside>

    <div class="stageWrap">
      <canvas id="stage" width="1640" height="855" style="width: 1640px; height: 855.625px; cursor: grab;" class=""></canvas>
      <div class="hint">คลิก = เลือกโหนด · ดับเบิลคลิก = ขยายความสัมพันธ์ · ลาก = ย้ายตำแหน่ง · scroll = ซูม</div>
    </div>

    <div class="panel" id="panel" data-open="false">
      <button class="panelClose" id="panelClose">✕</button>
      <div class="panelInner">
        <div class="panelMeta">
          <span class="panelSection" id="panelLabel"></span>
          <span class="panelIndex" id="panelIndex"></span>
        </div>
        <h2 class="panelTitle" id="panelTitle"></h2>
        <div class="panelId" id="panelNodeId"></div>
        <span class="statusBadge" id="panelStatus"></span>
        <table class="propTable" id="panelProps"></table>
        <div id="panelRelations"></div>
      </div>
      <div class="pager">
        <button class="pagerBtn" data-dir="prev" id="pagerPrev">
          <span class="arrow">←</span>
          <span class="meta"><span class="kick">Prev</span><span class="nm" id="pagerPrevName"></span></span>
        </button>
        <button class="pagerBtn" data-dir="next" id="pagerNext">
          <span class="meta"><span class="kick">Next</span><span class="nm" id="pagerNextName"></span></span>
          <span class="arrow">→</span>
        </button>
      </div>
    </div>
  </div>

<script>

let GRAPH_DATA = { nodes: [], edges: [], label_counts: {} };

async function initLiveGraph() {
  try {
    const res = await fetch('/api/graph');
    if (res.ok) {
      const data = await res.json();
      if (data && data.nodes && data.nodes.length > 0) {
        GRAPH_DATA = {
          nodes: data.nodes.map(n => ({
            id: String(n.id || n.name),
            label: n.label || 'Product',
            name: n.name || n.id,
            status: n.status || 'canonical',
            props: n.props || {}
          })),
          edges: (data.edges || []).map(e => ({
            source: String(e.from || e.source),
            target: String(e.to || e.target),
            type: e.type || e.rel || 'CONNECTED_TO',
            props: e.props || {}
          })),
          label_counts: {}
        };
        GRAPH_DATA.nodes.forEach(n => {
          GRAPH_DATA.label_counts[n.label] = (GRAPH_DATA.label_counts[n.label] || 0) + 1;
        });
      }
    }
  } catch (err) {
    console.error('Error fetching /api/graph from GenesisBlock DB:', err);
  }
}

(async function(){
  "use strict";

  await initLiveGraph();

  const LABEL_COLORS = {
    Customer:'--c-Customer', Document:'--c-Document', Product:'--c-Product', CatalogSource:'--c-CatalogSource',
    Brand:'--c-Brand', Competitor:'--c-Competitor', Org:'--c-Org', KnowledgeChunk:'--c-KnowledgeChunk',
    Category:'--c-CatalogSource'
  };
  const DEFAULT_ON = new Set(['Org','Brand','Competitor','Customer','CatalogSource','KnowledgeChunk','Product','Category']);
  const MAX_SIM_NODES = 700;

  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function colorFor(node){
    if(node.status === 'candidate') return cssVar('--c-candidate');
    const v = LABEL_COLORS[node.label];
    return v ? cssVar(v) : cssVar('--c-Product');
  }

  // ---------- index the data ----------
  const nodesById = new Map();
  GRAPH_DATA.nodes.forEach(n => nodesById.set(n.id, n));
  const adjacency = new Map(); // id -> [{edge, otherId, dir}]
  GRAPH_DATA.nodes.forEach(n => adjacency.set(n.id, []));
  GRAPH_DATA.edges.forEach(e => {
    if(!nodesById.has(e.source) || !nodesById.has(e.target)) return;
    adjacency.get(e.source).push({edge:e, otherId:e.target, dir:'out'});
    adjacency.get(e.target).push({edge:e, otherId:e.source, dir:'in'});
  });

  const labelCounts = GRAPH_DATA.label_counts || {};
  const allLabels = Object.keys(labelCounts).sort((a,b)=> (labelCounts[b]-labelCounts[a]));
  // DEFAULT_ON names the labels of the older business graph (Org, Brand, Customer, ...). The v4
  // catalog store uses its own (CatalogOffer, ProductModel, ProductType, ...), so intersecting the
  // two leaves nothing on and the viewer renders an empty canvas over a perfectly good graph.
  // Fall back to showing everything whenever the preferred set matches none of what actually
  // arrived; the per-label checkboxes still let you narrow it down.
  const preferredLabels = allLabels.filter(l => DEFAULT_ON.has(l));
  const activeLabels = new Set(preferredLabels.length ? preferredLabels : allLabels);

  // ---------- sim state ----------
  let simNodes = new Map();   // id -> {id,x,y,vx,vy,r,fixed}
  let simEdges = [];          // [{a,b,edge}]
  let expanded = new Set();   // ids force-visible via double-click
  let alpha = 1;
  let selectedId = null;
  let hoverId = null;

  function computeVisibleIds(){
    const ids = new Set();
    GRAPH_DATA.nodes.forEach(n => { if(activeLabels.has(n.label)) ids.add(n.id); });
    expanded.forEach(id => {
      ids.add(id);
      (adjacency.get(id) || []).forEach(a => ids.add(a.otherId));
    });
    if(ids.size > MAX_SIM_NODES){
      // keep only nodes that have at least one visible neighbour, then truncate deterministically
      const arr = Array.from(ids);
      arr.sort((a,b) => (adjacency.get(b)||[]).length - (adjacency.get(a)||[]).length);
      return new Set(arr.slice(0, MAX_SIM_NODES));
    }
    return ids;
  }

  function rebuildSim(preserveExisting){
    const ids = computeVisibleIds();
    const prev = simNodes;
    simNodes = new Map();
    let i = 0;
    ids.forEach(id => {
      const node = nodesById.get(id);
      const old = preserveExisting && prev.get(id);
      const angle = (i / ids.size) * Math.PI * 2;
      const rad = 40 + Math.sqrt(i) * 22;
      simNodes.set(id, old || {
        id, x: Math.cos(angle)*rad, y: Math.sin(angle)*rad, vx:0, vy:0,
        r: 4 + Math.min(6, Math.sqrt((adjacency.get(id)||[]).length))
      });
      i++;
    });
    simEdges = [];
    GRAPH_DATA.edges.forEach(e => {
      if(simNodes.has(e.source) && simNodes.has(e.target)) simEdges.push({a:e.source,b:e.target,edge:e});
    });
    alpha = 1;
    updateStatLine();
    renderBrowseList();
  }

  // ---------- physics: minimal force layout ----------
  function tick(){
    if(alpha <= 0.002) return;
    const arr = Array.from(simNodes.values());
    const n = arr.length;
    const REPEL = 900;
    for(let i=0;i<n;i++){
      const a = arr[i];
      if(a.fixed) continue;
      let fx=0, fy=0;
      for(let j=0;j<n;j++){
        if(i===j) continue;
        const b = arr[j];
        let dx = a.x-b.x, dy = a.y-b.y;
        let d2 = dx*dx+dy*dy;
        if(d2 < 0.01) { dx = (Math.random()-.5); dy = (Math.random()-.5); d2 = 1; }
        if(d2 > 90000) continue; // ignore far pairs for speed
        const d = Math.sqrt(d2);
        const f = REPEL / d2;
        fx += (dx/d)*f; fy += (dy/d)*f;
      }
      fx += -a.x * 0.006; fy += -a.y * 0.006; // gentle centering
      a.vx = (a.vx + fx*alpha) * 0.82;
      a.vy = (a.vy + fy*alpha) * 0.82;
    }
    simEdges.forEach(e => {
      const a = simNodes.get(e.a), b = simNodes.get(e.b);
      if(!a || !b) return;
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.sqrt(dx*dx+dy*dy) || 1;
      const target = 90;
      const f = (d - target) * 0.02 * alpha;
      const ux = dx/d, uy = dy/d;
      if(!a.fixed){ a.vx += ux*f; a.vy += uy*f; }
      if(!b.fixed){ b.vx -= ux*f; b.vy -= uy*f; }
    });
    arr.forEach(a => {
      if(a.fixed) return;
      a.x += a.vx; a.y += a.vy;
    });
    alpha *= 0.985;
  }

  // ---------- canvas / camera ----------
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const stageWrap = document.querySelector('.stageWrap');
  let cam = {x:0, y:0, k:1};
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  function resize(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    const rect = stageWrap.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
  }
  window.addEventListener('resize', resize);

  function worldToScreen(x,y){
    const rect = stageWrap.getBoundingClientRect();
    return [ (x - cam.x)*cam.k + rect.width/2, (y - cam.y)*cam.k + rect.height/2 ];
  }
  function screenToWorld(sx,sy){
    const rect = stageWrap.getBoundingClientRect();
    return [ (sx - rect.width/2)/cam.k + cam.x, (sy - rect.height/2)/cam.k + cam.y ];
  }

  function draw(){
    const ink = cssVar('--ink');
    const rect = stageWrap.getBoundingClientRect();
    ctx.save();
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,rect.width,rect.height);

    const neighbours = selectedId ? new Set((adjacency.get(selectedId)||[]).map(a=>a.otherId)) : null;
    const dim = !!selectedId;

    ctx.lineWidth = 1;
    simEdges.forEach(e => {
      const a = simNodes.get(e.a), b = simNodes.get(e.b);
      if(!a || !b) return;
      const [ax,ay] = worldToScreen(a.x,a.y);
      const [bx,by] = worldToScreen(b.x,b.y);
      const touches = selectedId && (e.a===selectedId || e.b===selectedId);
      ctx.strokeStyle = touches ? ink : (dim ? 'color-mix(in oklch, '+ink+' 6%, transparent)' : 'color-mix(in oklch, '+ink+' 14%, transparent)');
      ctx.globalAlpha = touches ? 0.8 : 1;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    simNodes.forEach(node => {
      const data = nodesById.get(node.id);
      const [sx,sy] = worldToScreen(node.x,node.y);
      const isFocus = node.id === selectedId || node.id === hoverId;
      const isNeighbour = neighbours && neighbours.has(node.id);
      const faded = dim && !isFocus && !isNeighbour;
      const r = node.r * Math.max(0.6, Math.min(1.6, cam.k));
      ctx.globalAlpha = faded ? 0.22 : 1;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI*2);
      ctx.fillStyle = colorFor(data);
      ctx.fill();
      if(isFocus){
        ctx.lineWidth = 2;
        ctx.strokeStyle = ink;
        ctx.stroke();
      } else if(data.status === 'candidate'){
        ctx.setLineDash([2,2]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = cssVar('--c-candidate');
        ctx.stroke();
        ctx.setLineDash([]);
      }
      const showLabel = isFocus || cam.k > 1.4 || (adjacency.get(node.id)||[]).length > 8;
      if(showLabel && !faded){
        ctx.globalAlpha = 1;
        ctx.fillStyle = ink;
        ctx.font = (isFocus? '700 ' : '500 ') + Math.max(10, 11*Math.min(1.4,cam.k)) + "px 'Leelawadee UI','Segoe UI',Tahoma,sans-serif";
        ctx.textBaseline = 'middle';
        ctx.fillText(truncate(data.name, 26), sx + r + 6, sy);
      }
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function truncate(s, n){ s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }

  function loop(){
    tick();
    draw();
    requestAnimationFrame(loop);
  }

  function fitView(){
    const arr = Array.from(simNodes.values());
    if(!arr.length){ cam = {x:0,y:0,k:1}; return; }
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    arr.forEach(n => { minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x); minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y); });
    const rect = stageWrap.getBoundingClientRect();
    const w = Math.max(60, maxX-minX), h = Math.max(60, maxY-minY);
    const k = Math.min(rect.width/(w*1.3), rect.height/(h*1.3), 2.2);
    cam = {x:(minX+maxX)/2, y:(minY+maxY)/2, k: Math.max(0.08,k)};
  }

  // ---------- pointer interaction ----------
  let dragNode = null, panning = false, panStart = null, camStart = null, moved = false;

  function nodeAtScreen(sx,sy){
    const [wx,wy] = screenToWorld(sx,sy);
    let best = null, bestD = Infinity;
    simNodes.forEach(n => {
      const dx = n.x-wx, dy = n.y-wy;
      const d = dx*dx+dy*dy;
      const hitR = (n.r + 6/cam.k);
      if(d < hitR*hitR && d < bestD){ bestD = d; best = n; }
    });
    return best;
  }

  canvas.addEventListener('pointerdown', ev => {
    canvas.setPointerCapture(ev.pointerId);
    const rect = canvas.getBoundingClientRect();
    const sx = ev.clientX-rect.left, sy = ev.clientY-rect.top;
    moved = false;
    const hit = nodeAtScreen(sx,sy);
    if(hit){ dragNode = hit; hit.fixed = true; }
    else { panning = true; panStart = [ev.clientX, ev.clientY]; camStart = {...cam}; canvas.classList.add('dragging'); }
  });
  canvas.addEventListener('pointermove', ev => {
    const rect = canvas.getBoundingClientRect();
    const sx = ev.clientX-rect.left, sy = ev.clientY-rect.top;
    if(dragNode){
      const [wx,wy] = screenToWorld(sx,sy);
      dragNode.x = wx; dragNode.y = wy; dragNode.vx=0; dragNode.vy=0;
      alpha = Math.max(alpha, 0.3);
      moved = true;
    } else if(panning){
      cam.x = camStart.x - (ev.clientX-panStart[0])/cam.k;
      cam.y = camStart.y - (ev.clientY-panStart[1])/cam.k;
      moved = true;
    } else {
      const hit = nodeAtScreen(sx,sy);
      hoverId = hit ? hit.id : null;
      canvas.style.cursor = hit ? 'pointer' : 'grab';
    }
  });
  window.addEventListener('pointerup', ev => {
    if(dragNode){ dragNode.fixed = false; }
    if(!moved && dragNode){ selectNode(dragNode.id); }
    else if(!moved && panning){ selectedId = null; closePanel(); }
    dragNode = null; panning = false; canvas.classList.remove('dragging');
  });
  canvas.addEventListener('dblclick', ev => {
    const rect = canvas.getBoundingClientRect();
    const hit = nodeAtScreen(ev.clientX-rect.left, ev.clientY-rect.top);
    if(hit){ expanded.add(hit.id); rebuildSim(true); }
  });
  canvas.addEventListener('wheel', ev => {
    ev.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = ev.clientX-rect.left, sy = ev.clientY-rect.top;
    const [wx,wy] = screenToWorld(sx,sy);
    const factor = Math.exp(-ev.deltaY*0.0012);
    cam.k = Math.min(6, Math.max(0.04, cam.k*factor));
    const [wx2,wy2] = screenToWorld(sx,sy);
    cam.x += (wx-wx2); cam.y += (wy-wy2);
  }, {passive:false});

  // ---------- legend / filters ----------
  const legendEl = document.getElementById('legend');
  function renderLegend(){
    legendEl.innerHTML = '';
    allLabels.forEach(label => {
      const row = document.createElement('label');
      row.className = 'legendRow';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = activeLabels.has(label);
      cb.addEventListener('change', () => {
        if(cb.checked) activeLabels.add(label); else activeLabels.delete(label);
        rebuildSim(true);
      });
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = cssVar(LABEL_COLORS[label] || '--c-Document');
      const name = document.createElement('span');
      name.className = 'legendName';
      name.textContent = label;
      const count = document.createElement('span');
      count.className = 'legendCount';
      count.textContent = labelCounts[label];
      row.append(cb, dot, name, count);
      legendEl.appendChild(row);
    });
  }

  // ---------- browse list ----------
  const browseListEl = document.getElementById('browseList');
  function renderBrowseList(){
    browseListEl.innerHTML = '';
    const ids = Array.from(simNodes.keys());
    const byLabel = {};
    ids.forEach(id => {
      const n = nodesById.get(id);
      (byLabel[n.label] = byLabel[n.label] || []).push(n);
    });
    Object.keys(byLabel).sort().forEach(label => {
      const group = document.createElement('div');
      group.className = 'browseGroup';
      const head = document.createElement('div');
      head.className = 'browseGroupHead';
      head.textContent = label + ' (' + byLabel[label].length + ')';
      group.appendChild(head);
      byLabel[label].sort((a,b)=>a.name.localeCompare(b.name)).forEach(n => {
        const row = document.createElement('div');
        row.className = 'browseRow';
        row.dataset.active = String(n.id === selectedId);
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = colorFor(n);
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = n.name;
        row.append(dot, nm);
        row.addEventListener('click', () => selectNode(n.id));
        group.appendChild(row);
      });
      browseListEl.appendChild(group);
    });
  }

  // ---------- search ----------
  const searchInput = document.getElementById('search');
  const searchResults = document.getElementById('searchResults');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ searchResults.classList.remove('open'); searchResults.innerHTML=''; return; }
    const matches = GRAPH_DATA.nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0,40);
    searchResults.innerHTML = '';
    matches.forEach(n => {
      const row = document.createElement('div');
      row.className = 'searchRow';
      const dot = document.createElement('span'); dot.className='dot'; dot.style.background = colorFor(n);
      const nm = document.createElement('span'); nm.style.flex='auto'; nm.textContent = n.name;
      const lb = document.createElement('span'); lb.className='rowLabel'; lb.textContent = n.label;
      row.append(dot, nm, lb);
      row.addEventListener('click', () => {
        searchResults.classList.remove('open'); searchInput.value = '';
        activeLabels.add(n.label);
        expanded.add(n.id);
        rebuildSim(true);
        selectNode(n.id);
      });
      searchResults.appendChild(row);
    });
    searchResults.classList.toggle('open', matches.length>0);
  });
  document.addEventListener('click', ev => {
    if(!ev.target.closest('.searchWrap')) searchResults.classList.remove('open');
  });

  // ---------- node detail panel ----------
  const panel = document.getElementById('panel');
  const PROP_SKIP = new Set(['excerpt']);
  function fmtKey(k){ return k.replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }
  function fmtVal(k,v){
    if(v === null || v === undefined) return '—';
    if(typeof v === 'boolean') return v ? 'ใช่' : 'ไม่';
    if(typeof v === 'number'){
      if(/value|amount|total|vat|price/i.test(k)) return '฿' + v.toLocaleString('en-US',{maximumFractionDigits:2});
      return v.toLocaleString('en-US');
    }
    return String(v);
  }

  function currentBrowseOrder(){
    return Array.from(simNodes.keys()).map(id => nodesById.get(id))
      .sort((a,b) => a.label===b.label ? a.name.localeCompare(b.name) : a.label.localeCompare(b.label));
  }

  function selectNode(id){
    if(!simNodes.has(id)){ expanded.add(id); rebuildSim(true); }
    selectedId = id;
    const node = simNodes.get(id);
    if(node){ cam.x = node.x; cam.y = node.y; if(cam.k < 0.4) cam.k = 1; }
    openPanel(id);
    renderBrowseList();
  }

  function openPanel(id){
    const n = nodesById.get(id);
    if(!n) return;
    panel.dataset.open = 'true';
    document.getElementById('panelLabel').textContent = n.label;
    document.getElementById('panelTitle').textContent = n.name;
    document.getElementById('panelNodeId').textContent = n.id;
    const statusEl = document.getElementById('panelStatus');
    statusEl.textContent = n.status;
    statusEl.className = 'statusBadge ' + (n.status === 'candidate' ? 'candidate' : 'canonical');

    const order = currentBrowseOrder();
    const idx = order.findIndex(x => x.id === id);
    document.getElementById('panelIndex').textContent = idx>=0 ? (idx+1)+' / '+order.length : '';

    const propsEl = document.getElementById('panelProps');
    propsEl.innerHTML = '';
    Object.entries(n.props || {}).forEach(([k,v]) => {
      if(PROP_SKIP.has(k) || v === null || v === undefined || v === '') return;
      const tr = document.createElement('tr');
      const td1 = document.createElement('td'); td1.textContent = fmtKey(k);
      const td2 = document.createElement('td'); td2.textContent = fmtVal(k,v);
      tr.append(td1,td2); propsEl.appendChild(tr);
    });
    if(n.props && n.props.excerpt){
      const tr = document.createElement('tr');
      const td1 = document.createElement('td'); td1.textContent = 'Excerpt';
      const td2 = document.createElement('td'); td2.textContent = n.props.excerpt;
      tr.append(td1,td2); propsEl.appendChild(tr);
    }

    const relEl = document.getElementById('panelRelations');
    relEl.innerHTML = '';
    const rels = adjacency.get(id) || [];
    const grouped = {};
    rels.forEach(r => {
      const key = (r.dir==='out'?'→ ':'← ') + r.edge.type;
      (grouped[key] = grouped[key] || []).push(r);
    });
    Object.keys(grouped).sort().forEach(key => {
      const block = document.createElement('div');
      block.className = 'relBlock';
      const label = document.createElement('div');
      label.className = 'relLabel';
      label.textContent = key + ' (' + grouped[key].length + ')';
      const list = document.createElement('div');
      list.className = 'relList';
      grouped[key].slice(0,60).forEach(r => {
        const other = nodesById.get(r.otherId);
        if(!other) return;
        const pill = document.createElement('button');
        pill.className = 'relPill';
        const dot = document.createElement('span'); dot.className='dot'; dot.style.background = colorFor(other);
        const nm = document.createElement('span'); nm.className='name'; nm.textContent = other.name;
        const dir = document.createElement('span'); dir.className='dir'; dir.textContent = other.label;
        pill.append(dot, nm, dir);
        pill.addEventListener('click', () => selectNode(other.id));
        list.appendChild(pill);
      });
      block.append(label, list);
      relEl.appendChild(block);
    });

    // pager
    const prev = idx>0 ? order[idx-1] : order[order.length-1];
    const next = idx>=0 && idx<order.length-1 ? order[idx+1] : order[0];
    document.getElementById('pagerPrevName').textContent = prev ? prev.name : '';
    document.getElementById('pagerNextName').textContent = next ? next.name : '';
    document.getElementById('pagerPrev').onclick = () => prev && selectNode(prev.id);
    document.getElementById('pagerNext').onclick = () => next && selectNode(next.id);
  }
  function closePanel(){ panel.dataset.open = 'false'; }
  document.getElementById('panelClose').addEventListener('click', () => { selectedId=null; closePanel(); });

  // ---------- top controls ----------
  document.getElementById('fitBtn').addEventListener('click', fitView);
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    const sb = document.getElementById('sidebar');
    sb.dataset.collapsed = sb.dataset.collapsed === 'true' ? 'false' : 'true';
  });
  document.getElementById('themeBtn').addEventListener('click', () => {
    const html = document.documentElement;
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = next;
    document.getElementById('themeBtn').textContent = next === 'dark' ? 'Light' : 'Dark';
  });

  function updateStatLine(){
    document.getElementById('statLine').textContent =
      simNodes.size + ' / ' + GRAPH_DATA.nodes.length + ' nodes · ' + simEdges.length + ' edges shown';
  }


  // ---------- export & download handlers ----------
  document.getElementById('exportJsonBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(GRAPH_DATA, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'smartgift-genesisblock-graph.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('exportHtmlBtn').addEventListener('click', () => {
    const standaloneHtml = '<!doctype html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([standaloneHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'smartgift-knowledge-graph-offline.html';
    a.click();
    URL.revokeObjectURL(url);
  });

  // ---------- boot ----------
  renderLegend();
  resize();
  rebuildSim(false);
  fitView();
  requestAnimationFrame(loop);
})();
</script>


</body></html>
